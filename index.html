<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraftHub: Your Learning Management Platform</title>
  <style>
    :root {
      --primary: #8B5CF6;
      --primary-hover: #7C3AED;
      --success: #F59E0B;
      --success-hover: #D97706;
      --danger: #EF4444;
      --danger-hover: #DC2626;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 32px 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 30px;
      color: var(--primary);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 15px;
    }

    /* Notification Banner */
    .alert {
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .alert.success {
      background-color: #FEF3C7;
      color: #92400E;
      border: 1px solid #FCD34D;
      display: block;
    }

    .alert.error {
      background-color: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
      display: block;
    }

    /* Card Panels */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Forms */
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, textarea, select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: #FFFFFF;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-warning {
      background-color: var(--success);
      color: #FFFFFF;
    }

    .btn-warning:hover:not(:disabled) {
      background-color: var(--success-hover);
    }

    .btn-danger {
      background-color: var(--danger);
      color: #FFFFFF;
    }

    .btn-danger:hover:not(:disabled) {
      background-color: var(--danger-hover);
    }

    .btn-secondary {
      background-color: #E2E8F0;
      color: #334155;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #CBD5E1;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
    }

    /* Spinner */
    .spinner-container {
      display: none;
      text-align: center;
      padding: 32px;
    }

    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Course Cards Grid */
    .courses-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .courses-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
    }

    .course-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: box-shadow 0.2s, transform 0.1s;
    }

    .course-card:hover {
      box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .course-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      white-space: nowrap;
    }

    .status-not-started {
      background-color: #F1F5F9;
      color: #475569;
      border: 1px solid #CBD5E1;
    }

    .status-in-progress {
      background-color: #EDE9FE;
      color: #6D28D9;
      border: 1px solid #DDD6FE;
    }

    .status-completed {
      background-color: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
    }

    .course-desc {
      color: #475569;
      font-size: 14px;
      margin-bottom: 14px;
      flex-grow: 1;
    }

    .course-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-top: 1px solid #F1F5F9;
      padding-top: 10px;
    }

    .course-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
    }

    /* Modal for Editing */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
      backdrop-filter: blur(2px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-content {
      background: #FFFFFF;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>CodeCraftHub: Your Learning Management Platform</h1>
      <p>Manage, track, and achieve your course learning goals</p>
    </header>

    <!-- Notification Message Area -->
    <div id="alertBox" class="alert"></div>

    <!-- Add Course Form Card -->
    <section class="card">
      <h2 class="card-title">Add New Course</h2>
      <form id="addCourseForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Course Name *</label>
            <input type="text" id="name" placeholder="e.g. Python Basics" required />
          </div>
          <div class="form-group">
            <label for="targetDate">Target Completion Date *</label>
            <input type="date" id="targetDate" required />
          </div>
          <div class="form-group full-width">
            <label for="description">Course Description *</label>
            <textarea id="description" placeholder="Brief summary of topics covered..." required></textarea>
          </div>
          <div class="form-group full-width">
            <label for="status">Current Status *</label>
            <select id="status" required>
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        <div>
          <button type="submit" id="addBtn" class="btn btn-primary">Add Course</button>
        </div>
      </form>
    </section>

    <!-- Courses List Section -->
    <section class="card">
      <div class="card-title">
        <span>Your Courses</span>
        <span id="courseCountBadge" style="font-size: 14px; font-weight: normal; color: var(--text-muted);">0 Courses</span>
      </div>

      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="spinner-container">
        <div class="spinner"></div>
        <p style="margin-top: 10px; color: var(--text-muted); font-size: 14px;">Loading courses...</p>
      </div>

      <!-- Courses Grid Display -->
      <div id="coursesList" class="courses-grid"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <p>No courses found. Add your first course above to get started!</p>
      </div>
    </section>
  </div>

  <!-- Edit Course Modal -->
  <div id="editModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Course</h3>
        <button type="button" class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editCourseForm">
        <input type="hidden" id="editId" />
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="editName">Course Name *</label>
          <input type="text" id="editName" required />
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="editTargetDate">Target Completion Date *</label>
          <input type="date" id="editTargetDate" required />
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="editDescription">Course Description *</label>
          <textarea id="editDescription" required></textarea>
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="editStatus">Status *</label>
          <select id="editStatus" required>
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" id="saveEditBtn" class="btn btn-warning">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Configuration: Base API URL
    const API_BASE_URL = "http://localhost:5000/api/courses";

    // DOM Elements
    const alertBox = document.getElementById("alertBox");
    const addCourseForm = document.getElementById("addCourseForm");
    const editCourseForm = document.getElementById("editCourseForm");
    const coursesList = document.getElementById("coursesList");
    const loadingSpinner = document.getElementById("loadingSpinner");
    const emptyState = document.getElementById("emptyState");
    const courseCountBadge = document.getElementById("courseCountBadge");
    const editModal = document.getElementById("editModal");

    // Local cached courses array
    let courses = [];

    // Helper: Display Alerts (success or error)
    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      setTimeout(() => {
        alertBox.className = "alert";
      }, 5000);
    }

    // Helper: Show/Hide Loading Spinner
    function setLoading(isLoading) {
      loadingSpinner.style.display = isLoading ? "block" : "none";
    }

    // Helper: Get Badge CSS Class for Status
    function getStatusBadgeClass(status) {
      switch (status) {
        case "Completed":
          return "status-completed";
        case "In Progress":
          return "status-in-progress";
        default:
          return "status-not-started";
      }
    }

    // Render Courses to UI
    function renderCourses() {
      coursesList.innerHTML = "";
      courseCountBadge.textContent = `${courses.length} ${courses.length === 1 ? 'Course' : 'Courses'}`;

      if (courses.length === 0) {
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";

      courses.forEach((course) => {
        const card = document.createElement("div");
        card.className = "course-card";

        const formattedCreated = course.created_at
          ? new Date(course.created_at).toLocaleDateString()
          : "N/A";

        card.innerHTML = `
          <div>
            <div class="course-header">
              <h3 class="course-title">${escapeHtml(course.name)}</h3>
              <span class="status-badge ${getStatusBadgeClass(course.status)}">${escapeHtml(course.status)}</span>
            </div>
            <p class="course-desc">${escapeHtml(course.description)}</p>
          </div>
          <div>
            <div class="course-meta">
              <div><strong>Target Date:</strong> ${escapeHtml(course.target_date)}</div>
              <div><strong>Created:</strong> ${formattedCreated} (ID: ${course.id})</div>
            </div>
            <div class="course-actions">
              <button class="btn btn-warning btn-sm" onclick="openEditModal(${course.id})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCourse(${course.id})">Remove</button>
            </div>
          </div>
        `;

        coursesList.appendChild(card);
      });
    }

    // Escape HTML to prevent XSS
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 1. GET /api/courses - Load all courses
    async function fetchCourses() {
      setLoading(true);
      try {
        const response = await fetch(API_BASE_URL);
        if (!response.ok) {
          throw new Error(`Failed to load courses (HTTP ${response.status})`);
        }
        const data = await response.json();
        // Handle direct array or { courses: [...] } envelope
        courses = Array.isArray(data) ? data : (data.courses || []);
        renderCourses();
      } catch (error) {
        console.error("Error loading courses:", error);
        showAlert(
          `Unable to connect to backend at ${API_BASE_URL}. Ensure your server is running with 'npm start'!`,
          "error"
        );
      } finally {
        setLoading(false);
      }
    }

    // 2. POST /api/courses - Create course
    addCourseForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const description = document.getElementById("description").value.trim();
      const targetDate = document.getElementById("targetDate").value;
      const status = document.getElementById("status").value;

      if (!name || !description || !targetDate || !status) {
        showAlert("All fields are required.", "error");
        return;
      }

      const submitBtn = document.getElementById("addBtn");
      submitBtn.disabled = true;

      try {
        const response = await fetch(API_BASE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            description,
            target_date: targetDate,
            status
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${response.status}`);
        }

        showAlert("Course added successfully!", "success");
        addCourseForm.reset();
        await fetchCourses();
      } catch (error) {
        console.error("Error adding course:", error);
        showAlert(`Failed to add course: ${error.message}`, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 3. Open Edit Modal
    window.openEditModal = function (id) {
      const course = courses.find((c) => c.id === id);
      if (!course) return;

      document.getElementById("editId").value = course.id;
      document.getElementById("editName").value = course.name;
      document.getElementById("editDescription").value = course.description;
      document.getElementById("editTargetDate").value = course.target_date;
      document.getElementById("editStatus").value = course.status;

      editModal.classList.add("open");
    };

    // Close Edit Modal
    window.closeEditModal = function () {
      editModal.classList.remove("open");
      editCourseForm.reset();
    };

    // 4. PUT /api/courses/:id - Update course
    editCourseForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = parseInt(document.getElementById("editId").value, 10);
      const name = document.getElementById("editName").value.trim();
      const description = document.getElementById("editDescription").value.trim();
      const targetDate = document.getElementById("editTargetDate").value;
      const status = document.getElementById("editStatus").value;

      if (!name || !description || !targetDate || !status) {
        showAlert("All fields are required.", "error");
        return;
      }

      const saveBtn = document.getElementById("saveEditBtn");
      saveBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            description,
            target_date: targetDate,
            status
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${response.status}`);
        }

        showAlert("Course updated successfully!", "success");
        closeEditModal();
        await fetchCourses();
      } catch (error) {
        console.error("Error updating course:", error);
        showAlert(`Failed to update course: ${error.message}`, "error");
      } finally {
        saveBtn.disabled = false;
      }
    });

    // 5. DELETE /api/courses/:id - Delete course
    window.deleteCourse = async function (id) {
      const course = courses.find((c) => c.id === id);
      const courseName = course ? `"${course.name}"` : "this course";

      if (!confirm(`Are you sure you want to remove ${courseName}?`)) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/${id}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${response.status}`);
        }

        showAlert("Course removed successfully!", "success");
        await fetchCourses();
      } catch (error) {
        console.error("Error deleting course:", error);
        showAlert(`Failed to delete course: ${error.message}`, "error");
      }
    };

    // Close modal if backdrop clicked
    editModal.addEventListener("click", (e) => {
      if (e.target === editModal) {
        closeEditModal();
      }
    });

    // Initial Load
    fetchCourses();
  </script>
</body>
</html>
